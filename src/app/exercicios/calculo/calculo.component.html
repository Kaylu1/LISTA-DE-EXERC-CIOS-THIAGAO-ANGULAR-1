<section class="cartao">
  <h2>2. Calculando com Interpolation</h2>
  <p class="objetivo">Interpolation com expressões e pipe currency</p>

  <div class="resultado">
    <p>Produto: {{ produto }}</p>
    <p>Preço: {{ preco | currency }}</p>
    <p>Quantidade: {{ quantidade }}</p>
    <p class="destaque">Total: {{ preco * quantidade | currency }}</p>
  </div>
</section>
